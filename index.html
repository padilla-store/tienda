<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso bloqueado</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@300;400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f9fa;
      font-family: 'Roboto', 'Google Sans', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #202124;
    }

    .container {
      text-align: center;
      max-width: 480px;
      padding: 40px 24px;
      animation: fadeIn 0.6s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Google logo */
    .google-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      font-family: 'Google Sans', Arial, sans-serif;
    }

    .g-b  { color: #4285f4; }
    .g-r  { color: #ea4335; }
    .g-y  { color: #fbbc04; }
    .g-bl { color: #4285f4; }
    .g-g  { color: #34a853; }
    .g-r2 { color: #ea4335; }

    /* Failed icon */
    .failed-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .failed-icon {
      width: 56px;
      height: 56px;
      background: #fce8e6;
      border: 2.5px solid #ea4335;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: failedPulse 2s ease-in-out infinite;
    }

    .failed-icon svg {
      width: 28px;
      height: 28px;
    }

    @keyframes failedPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(234,67,53,0.3); }
      50%       { box-shadow: 0 0 0 8px rgba(234,67,53,0); }
    }

    .failed-text {
      font-size: 13px;
      font-weight: 500;
      color: #ea4335;
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e8eaed;
      margin: 0 0 24px 0;
    }

    .error-code {
      font-size: 12px;
      color: #9aa0a6;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 14px;
      color: #5f6368;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .details {
      font-size: 12px;
      color: #9aa0a6;
      line-height: 2;
      text-align: left;
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 8px;
      padding: 16px 20px;
    }

    .details span {
      color: #5f6368;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="google-logo">
      <span class="g-b">G</span><span class="g-r">o</span><span class="g-y">o</span><span class="g-bl">g</span><span class="g-g">l</span><span class="g-r2">e</span>
    </div>

    <div class="failed-wrapper">
      <div class="failed-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6L18 18M6 18L18 6" stroke="#ea4335" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <p class="failed-text">Error fatal &nbsp;/&nbsp; Critical Error</p>

    <hr class="divider" />

    <p class="error-code">ERR_DOMAIN_BLOCKED &nbsp;&middot;&nbsp; Código: G-403</p>

    <h1>Google ha bloqueado este dominio</h1>

    <p class="subtitle">
      Google Safe Browsing ha restringido de forma permanente este dominio.
    </p>

    <div class="details">
      <div><span>Dominio:</span> padillastore.com</div>
      <div><span>Estado:</span> Bloqueado</div>
      <div><span>Motivo:</span> DMCA</div>
      <div><span>Referencia:</span> GSB-2026-08-PADILLA</div>
    </div>

  </div>
</body>
</html>
